<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="ubeBase" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4a0e4e"/>
      <stop offset="60%" stop-color="#7b2cbf"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>
    <linearGradient id="ubeMilk" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#9d4edd"/>
      <stop offset="30%" stop-color="#e0aaff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="matchaLayer" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#406a14"/>
      <stop offset="60%" stop-color="#79A83E"/>
      <stop offset="100%" stop-color="#9dce58"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <ellipse cx="200" cy="540" rx="90" ry="18" fill="rgba(0,0,0,0.25)" filter="url(#shadow)"/>
  <path d="M120 120 L135 500 C137 520 150 530 200 530 C250 530 263 520 265 500 L280 120 Z" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.6)" stroke-width="3"/>

  <!-- Ube Base -->
  <path d="M133 440 C145 430 170 450 200 440 C230 430 255 450 267 440 L264 500 C262 516 250 526 200 526 C150 526 138 516 136 500 Z" fill="url(#ubeBase)"/>

  <!-- Milk Layer -->
  <path d="M127 260 C150 250 180 270 200 260 C230 250 255 270 273 260 L267 440 C255 450 230 430 200 440 C170 450 145 430 133 440 Z" fill="url(#ubeMilk)" opacity="0.95"/>

  <!-- Matcha Top -->
  <path d="M120 120 L127 260 C145 250 170 270 200 260 C230 250 255 270 273 260 L280 120 Z" fill="url(#matchaLayer)"/>

  <!-- Ice Cubes -->
  <rect x="150" y="150" width="45" height="45" rx="8" fill="rgba(255,255,255,0.4)" stroke="rgba(255,255,255,0.7)" stroke-width="2" transform="rotate(12 172 172)"/>
  <rect x="200" y="180" width="40" height="40" rx="8" fill="rgba(255,255,255,0.35)" stroke="rgba(255,255,255,0.7)" stroke-width="2" transform="rotate(-8 220 200)"/>

  <!-- Highlights -->
  <ellipse cx="200" cy="120" rx="80" ry="12" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="3"/>
  <path d="M130 135 L140 490" stroke="rgba(255,255,255,0.5)" stroke-width="5" stroke-linecap="round"/>
  <path d="M230 70 L210 510" stroke="rgba(255,255,255,0.6)" stroke-width="12" stroke-linecap="round"/>
</svg>
